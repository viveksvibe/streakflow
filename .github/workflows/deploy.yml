# =============================================================================
# Deploy to EC2 (Backend only)
# =============================================================================
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions)
# -----------------------------------------------------------------------------
# DOCKERHUB_USERNAME   Docker Hub account name (used to tag image)
# DOCKERHUB_TOKEN      Docker Hub access token (NOT account password)
# EC2_SSH_PRIVATE_KEY  SSH private key for the EC2 Ubuntu user (ed25519 or rsa)
# EC2_HOST             Public IP / hostname of the EC2 instance
# EC2_SSH_PORT         SSH port (e.g. 22)
# EC2_USERNAME         SSH user on EC2 (e.g. ubuntu)
# DATABASE_URL         PostgreSQL connection string (including credentials)
# JWT_SECRET           Secret used for JWT access tokens
# JWT_REFRESH_SECRET   Secret used for JWT refresh tokens
# GOOGLE_CLIENT_ID     Google OAuth client ID
# GOOGLE_CLIENT_SECRET Google OAuth client secret
# FRONTEND_URL         Origin of the Cloudflare Pages frontend
# PORT                 Port the backend listens on (e.g. 3000)
# NODE_ENV             Environment (production)
#
# NOTE: the app reads JWT_ACCESS_SECRET / JWT_REFRESH_SECRET from the
# container environment, so the GitHub secrets JWT_SECRET and
# JWT_REFRESH_SECRET are mapped to those names in docker-compose.yml below.
#
# No VITE_* secrets are needed here — the frontend is built & deployed
# independently on Cloudflare Pages.
# =============================================================================

name: Deploy to EC2

on:
  push:
    branches: [main]

# NOTE: Docker Hub secrets live in the "production" environment, not as
# repository secrets. Environment secrets are only resolvable inside jobs
# that declare `environment: production`, so IMAGE_NAME is computed at job
# level in build-and-push (workflow-level env would resolve it to "/...").

jobs:
  test:
    name: Lint + Typecheck (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  build-and-push:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/streakflow-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Hub secrets are set
        run: |
          if [ -z "${IMAGE_NAME%%/*}" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is not set (IMAGE_NAME='$IMAGE_NAME'). Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USERNAME }}
      EC2_PORT: ${{ secrets.EC2_SSH_PORT }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/streakflow-backend
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      PORT: ${{ secrets.PORT }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
    steps:
      - name: Configure SSH
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p ~/.ssh

          # --- strip any accidental whitespace/newlines from the host value ---
          EC2_HOST_CLEAN=$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')
          [ -n "$EC2_HOST_CLEAN" ] || fail "EC2_HOST secret is empty"

          # Write the private key robustly: strip CR chars (Windows copy/paste)
          # and guarantee a trailing newline, which OpenSSH requires.
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          grep -q -- 'BEGIN .* PRIVATE KEY' ~/.ssh/id_ed25519 || \
            fail "EC2_SSH_PRIVATE_KEY does not look like a PEM private key (missing BEGIN line)"

          EC2_PORT="${EC2_PORT:-22}"

          # Populate known_hosts via ssh-keyscan.
          # If DNS resolution fails here it will also fail during the actual SSH
          # deploy — surface a clear diagnostic instead of a cryptic keyscan error.
          if ! ssh-keyscan -p "$EC2_PORT" -T 10 -H "$EC2_HOST_CLEAN" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            KEYSCAN_ERR=$(cat /tmp/keyscan.err)
            if echo "$KEYSCAN_ERR" | grep -q "Name or service not known"; then
              fail "Cannot resolve EC2_HOST — make sure the secret is a public IP or resolvable hostname. If your EC2 instance uses a dynamic public IP, assign an Elastic IP and update the secret."
            fi
            fail "ssh-keyscan failed: $KEYSCAN_ERR"
          fi

          # Write a typed SSH config so every later step uses the same settings
          cat > ~/.ssh/config <<EOF
Host ec2-target
  HostName $EC2_HOST_CLEAN
  User $EC2_USER
  Port $EC2_PORT
  IdentityFile ~/.ssh/id_ed25519
  StrictHostKeyChecking accept-new
  UserKnownHostsFile ~/.ssh/known_hosts
  ServerAliveInterval 30
  ServerAliveCountMax 3
EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to EC2
        run: |
          ssh ec2-target \
            "DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             IMAGE_NAME='$IMAGE_NAME' \
             DATABASE_URL='$DATABASE_URL' \
             JWT_SECRET='$JWT_SECRET' \
             JWT_REFRESH_SECRET='$JWT_REFRESH_SECRET' \
             GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' \
             GOOGLE_CLIENT_SECRET='$GOOGLE_CLIENT_SECRET' \
             FRONTEND_URL='$FRONTEND_URL' \
             PORT='$PORT' \
             NODE_ENV='$NODE_ENV' \
             bash -s" << 'EOF'
          set -e

          # Log in to Docker Hub
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

          # Pull the newly pushed image
          docker pull "$IMAGE_NAME:latest"

          # Write docker-compose.yml (unquoted heredoc so ${VAR} is expanded
          # from the shell environment exported above)
          cat > docker-compose.yml << COMPOSE_EOF
          services:
            backend:
              image: ${IMAGE_NAME}:latest
              container_name: streakflow-backend
              restart: unless-stopped
              environment:
                - DATABASE_URL=${DATABASE_URL}
                - JWT_ACCESS_SECRET=${JWT_SECRET}
                - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
                - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
                - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
                - FRONTEND_URL=${FRONTEND_URL}
                - PORT=${PORT}
                - NODE_ENV=${NODE_ENV}
              ports:
                - "${PORT}:${PORT}"
              networks:
                - app-network

          networks:
            app-network:
              driver: bridge
          COMPOSE_EOF

          # Deploy (-y answers prompts non-interactively so Compose does not
          # consume stdin and silently skip later commands)
          docker compose up -d --remove-orphans -y

          # Prune old images
          docker image prune -f

          echo "Deployment complete"
          EOF

      - name: Verify container running
        run: |
          ssh ec2-target "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
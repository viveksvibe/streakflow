# =============================================================================
# Deploy to EC2 (Backend only)
# =============================================================================
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions)
# -----------------------------------------------------------------------------
# DOCKERHUB_USERNAME   Docker Hub account name (used to tag image)
# DOCKERHUB_TOKEN      Docker Hub access token (NOT account password)
# EC2_SSH_PRIVATE_KEY  SSH private key for the EC2 Ubuntu user (ed25519 or rsa)
# EC2_HOST             Public IP / hostname of the EC2 instance
# EC2_SSH_PORT         SSH port (e.g. 22)
# EC2_USERNAME         SSH user on EC2 (e.g. ubuntu)
# DATABASE_URL         PostgreSQL connection string (including credentials)
# JWT_SECRET           Secret used for JWT access tokens
# JWT_REFRESH_SECRET   Secret used for JWT refresh tokens
# GOOGLE_CLIENT_ID     Google OAuth client ID
# GOOGLE_CLIENT_SECRET Google OAuth client secret
# FRONTEND_URL         Origin of the Cloudflare Pages frontend
# PORT                 Port the backend listens on (e.g. 3000)
# NODE_ENV             Environment (production)
#
# NOTE: the app reads JWT_ACCESS_SECRET / JWT_REFRESH_SECRET from the
# container environment, so the GitHub secrets JWT_SECRET and
# JWT_REFRESH_SECRET are mapped to those names in docker-compose.yml below.
#
# No VITE_* secrets are needed here — the frontend is built & deployed
# independently on Cloudflare Pages.
# =============================================================================

name: Deploy to EC2

on:
  push:
    branches: [main]

# NOTE: Docker Hub secrets live in the "production" environment, not as
# repository secrets. Environment secrets are only resolvable inside jobs
# that declare `environment: production`, so IMAGE_NAME is computed at job
# level in build-and-push (workflow-level env would resolve it to "/...").

jobs:
  test:
    name: Lint + Typecheck (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  build-and-push:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/streakflow-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Hub secrets are set
        run: |
          if [ -z "${IMAGE_NAME%%/*}" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is not set (IMAGE_NAME='$IMAGE_NAME'). Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USERNAME }}
      EC2_PORT: ${{ secrets.EC2_SSH_PORT }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/streakflow-backend
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      PORT: ${{ secrets.PORT }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
    steps:
      - name: Configure SSH
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p ~/.ssh

          # --- structural validation (prints shapes, never secret values) ---
          [ -n "$EC2_HOST" ] || fail "EC2_HOST secret is not set"
          HOST_WORDS=$(echo "$EC2_HOST" | wc -w)
          HOST_LINES=$(echo "$EC2_HOST" | wc -l)
          if [ "$HOST_WORDS" -ne 1 ] || [ "$HOST_LINES" -ne 1 ]; then
            fail "EC2_HOST must be exactly one hostname or IP with no spaces/newlines (got $HOST_WORDS words on $HOST_LINES lines)"
          fi

          # Write the private key robustly: strip CR chars (Windows copy/paste)
          # and guarantee a trailing newline, which OpenSSH requires.
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          grep -q -- 'BEGIN .* PRIVATE KEY' ~/.ssh/id_ed25519 || \
            fail "EC2_SSH_PRIVATE_KEY does not look like a PEM private key (missing BEGIN line)"
          EC2_PORT="${EC2_PORT:-22}"

          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -p "$EC2_PORT" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" \
            "DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             IMAGE_NAME='$IMAGE_NAME' \
             DATABASE_URL='$DATABASE_URL' \
             JWT_SECRET='$JWT_SECRET' \
             JWT_REFRESH_SECRET='$JWT_REFRESH_SECRET' \
             GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' \
             GOOGLE_CLIENT_SECRET='$GOOGLE_CLIENT_SECRET' \
             FRONTEND_URL='$FRONTEND_URL' \
             PORT='$PORT' \
             NODE_ENV='$NODE_ENV' \
             bash -s" << 'EOF'
          set -e

          # Log in to Docker Hub
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

          # Pull the newly pushed image
          docker pull "$IMAGE_NAME:latest"

          # Write docker-compose.yml (unquoted heredoc so ${VAR} is expanded
          # from the shell environment exported above)
          cat > docker-compose.yml << COMPOSE_EOF
          services:
            backend:
              image: ${IMAGE_NAME}:latest
              container_name: streakflow-backend
              restart: unless-stopped
              environment:
                - DATABASE_URL=${DATABASE_URL}
                - JWT_ACCESS_SECRET=${JWT_SECRET}
                - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
                - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
                - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
                - FRONTEND_URL=${FRONTEND_URL}
                - PORT=${PORT}
                - NODE_ENV=${NODE_ENV}
              ports:
                - "${PORT}:${PORT}"
              networks:
                - app-network

          networks:
            app-network:
              driver: bridge
          COMPOSE_EOF

          # Deploy (-y answers prompts non-interactively so Compose does not
          # consume stdin and silently skip later commands)
          docker compose up -d --remove-orphans -y

          # Prune old images
          docker image prune -f

          echo "Deployment complete"
          EOF

      - name: Verify container running
        run: |
          ssh -p "${{ secrets.EC2_SSH_PORT }}" -o StrictHostKeyChecking=no "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"